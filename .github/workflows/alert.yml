name: SMART Slugs Alert
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
jobs:
  check-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run SMART slugs check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python smart_slugs.py
      - name: Save history to prevent duplicates
        run: |
          git config user.name "wb-bot"
          git config user.email "bot@wb.com"
          git add seen_slugs.json || echo "no history yet"
          git diff --staged --quiet || git commit -m "update seen_slugs [skip ci]"
          git push || echo "push failed"

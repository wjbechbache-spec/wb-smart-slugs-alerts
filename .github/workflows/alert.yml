name: SMART Slugs Alert
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python smart_slugs.py
      - name: Save memory
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add seen_slugs.json
          git commit -m "update seen" || echo "no change"
          git push
